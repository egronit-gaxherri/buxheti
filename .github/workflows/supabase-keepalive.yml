name: Supabase Keep-Alive

on:
  schedule:
    # Çdo 3 ditë në orën 09:00 UTC, që Supabase Free Tier të mos e pauzojë kurrë projektin pas 7 ditësh
    - cron: '0 9 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "Supabase variables not set, skipping."
            exit 0
          fi
          curl -sS -X POST "${SUPABASE_URL}/rest/v1/rpc/household_info" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"p_token":"keepalive"}' || true
